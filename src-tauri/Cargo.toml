[package]
name = "show-worker"
version = "0.1.0"
description = "Cross-platform Typora-style Markdown Editor built with Tauri 2"
authors = ["xingpengcheng"]
edition = "2021"
default-run = "ShowWorker"

[lib]
name = "show_worker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ShowWorker"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
walkdir = "2"
